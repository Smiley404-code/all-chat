<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feather 🪶</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232D6A4F'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>F</text></svg>">
<style>
  :root{
    --dark:#1B4332;
    --green:#2D6A4F;
    --bright:#40916C;
    --mint:#95D5B2;
    --mint-soft:#B7E4C7;
    --mint-bg:#D8F3DC;
    --paper:#F0F7F2;
    --out:#B7E4C7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--mint-bg);
    color:var(--dark);
  }
  .app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(27,67,50,.12);}

  /* header */
  header{background:var(--dark);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  header .logo{font-size:1.25rem;font-weight:800;letter-spacing:.2px;}
  header .sp{flex:1;}
  header .ic{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:6px;border-radius:8px;}
  header .ic:active{background:rgba(255,255,255,.15);}
  .menu{position:absolute;top:48px;right:10px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(27,67,50,.25);overflow:hidden;display:none;z-index:30;min-width:170px;}
  .menu.open{display:block;}
  .menu button{display:flex;gap:10px;align-items:center;width:100%;padding:13px 16px;border:none;background:#fff;font-size:.92rem;font-weight:700;color:var(--dark);cursor:pointer;}
  .menu button:active{background:var(--mint-bg);}
  .me-line{font-size:.75rem;color:var(--mint-soft);font-weight:600;}

  /* search bar */
  .sbar{padding:10px 12px;background:var(--paper);position:sticky;top:56px;z-index:15;}
  .sbar .wrap{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 1px 4px rgba(27,67,50,.10);}
  .sbar input{border:none;outline:none;flex:1;font:inherit;font-size:.95rem;background:transparent;color:var(--dark);}
  .sbar .mag{font-size:1rem;}

  /* chat rows */
  .list{flex:1;overflow-y:auto;}
  .crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;background:transparent;cursor:pointer;text-align:left;border-bottom:1px solid rgba(27,67,50,.07);}
  .crow:active{background:var(--mint-bg);}
  .avatar{width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem;flex:0 0 auto;text-transform:uppercase;}
  .crow .mid{flex:1;min-width:0;}
  .crow .n{font-weight:700;font-size:1rem;}
  .crow .m{font-size:.84rem;color:#52796F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .crow .t{font-size:.72rem;color:#74A892;flex:0 0 auto;align-self:flex-start;margin-top:4px;}
  .empty{text-align:center;color:#52796F;padding:60px 24px;font-size:.92rem;line-height:1.6;}
  .empty .big{font-size:2.6rem;display:block;margin-bottom:10px;}
  .sec-label{font-size:.72rem;font-weight:800;color:#74A892;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px 6px;}

  /* chat screen */
  .chatwrap{flex:1;display:flex;flex-direction:column;min-height:0;}
  .chat-head{background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:0;z-index:20;}
  .chat-head .bk{background:none;border:none;color:#fff;font-size:1.15rem;cursor:pointer;padding:6px 8px;border-radius:8px;}
  .chat-head .bk:active{background:rgba(255,255,255,.15);}
  .chat-head .avatar{width:38px;height:38px;font-size:.95rem;background:var(--bright);}
  .chat-head .nm{font-weight:700;font-size:1rem;}
  .chat-head .st{font-size:.72rem;color:var(--mint-soft);}
  .msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:
    radial-gradient(circle at 20% 30%, rgba(149,213,178,.18) 0 60px, transparent 61px),
    radial-gradient(circle at 80% 70%, rgba(149,213,178,.16) 0 70px, transparent 71px),
    var(--mint-bg);}
  .day{align-self:center;background:#fff;color:#52796F;font-size:.7rem;font-weight:700;padding:4px 12px;border-radius:999px;margin:4px 0 8px;box-shadow:0 1px 2px rgba(27,67,50,.10);}
  .bubble{max-width:78%;padding:8px 12px;border-radius:14px;font-size:.93rem;line-height:1.35;box-shadow:0 1px 1px rgba(27,67,50,.12);word-break:break-word;}
  .bubble.in{align-self:flex-start;background:#fff;border-top-left-radius:4px;}
  .bubble.out{align-self:flex-end;background:var(--out);border-top-right-radius:4px;}
  .bubble .tm{display:block;font-size:.62rem;color:#74A892;text-align:right;margin-top:2px;}
  .composer{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--paper);position:sticky;bottom:0;}
  .composer input{flex:1;border:none;outline:none;background:#fff;border-radius:999px;padding:12px 16px;font:inherit;font-size:.95rem;box-shadow:0 1px 3px rgba(27,67,50,.12);color:var(--dark);}
  .composer .snd{width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:1.1rem;cursor:pointer;flex:0 0 auto;}
  .composer .snd:active{background:var(--dark);}

  /* auth overlay */
  .auth{position:fixed;inset:0;background:var(--mint-bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth[hidden]{display:none;}
  .auth .card{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:340px;box-shadow:0 8px 30px rgba(27,67,50,.18);}
  .auth h1{font-size:1.5rem;color:var(--dark);margin:0 0 4px;}
  .auth .sub{font-size:.85rem;color:#52796F;margin-bottom:18px;}
  .auth input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--mint-soft);background:var(--mint-bg);font:inherit;font-size:.95rem;margin-bottom:10px;outline:none;color:var(--dark);}
  .auth input:focus{border-color:var(--green);}
  .auth .go{width:100%;padding:14px;border:none;border-radius:999px;background:var(--dark);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;}
  .auth .go:active{background:var(--green);}
  .auth .go:disabled{opacity:.6;}
  .auth .err{color:#B91C1C;font-size:.82rem;min-height:1.2em;margin:2px 0 8px;}
  .auth .sw{margin-top:12px;text-align:center;font-size:.85rem;color:#52796F;}
  .auth .sw button{background:none;border:none;color:var(--green);font-weight:800;font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;}

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:90;max-width:86vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <header id="mainHead">
    <div>
      <div class="logo">Feather 🪶</div>
      <div class="me-line" id="meLine"></div>
    </div>
    <div class="sp"></div>
    <button class="ic" id="searchBtn" aria-label="Find friends">🔍</button>
    <button class="ic" id="menuBtn" aria-label="Menu">⋮</button>
    <div class="menu" id="menu">
      <button id="menuLogout">🚪 Log out</button>
    </div>
  </header>

  <!-- CHATS LIST (default) -->
  <section id="chatsView" class="chatwrap" style="display:none;">
    <div class="list" id="convList"></div>
    <div class="empty" id="noChats" hidden>
      <span class="big">🪶</span>
      No chats yet!<br>Tap 🔍 above to find your friends<br>and start chatting.
    </div>
  </section>

  <!-- SEARCH VIEW -->
  <section id="searchView" class="chatwrap" style="display:none;">
    <div class="sbar">
      <div class="wrap">
        <input id="searchInput" placeholder="Search username..." autocapitalize="none" autocomplete="off">
        <span class="mag">🔍</span>
      </div>
    </div>
    <div class="list">
      <div class="sec-label" id="searchLabel" hidden>People</div>
      <div id="searchList"></div>
      <div class="empty" id="searchEmpty">
        <span class="big">🔍</span>
        Type your friend's username<br>to find them and start a chat!
      </div>
    </div>
  </section>

  <!-- CHAT VIEW -->
  <section id="chatView" class="chatwrap" style="display:none;">
    <div class="chat-head">
      <button class="bk" id="chatBack">←</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div>
        <div class="nm" id="chatName">...</div>
        <div class="st">🪶 Feather chat</div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <input id="chatInput" placeholder="Message..." autocomplete="off">
      <button class="snd" id="chatSend">➤</button>
    </div>
  </section>

  <!-- AUTH -->
  <div class="auth" id="auth" hidden>
    <div class="card">
      <h1>Feather 🪶</h1>
      <div class="sub" id="authSub">Log in to chat with your friends!</div>
      <input id="authUser" placeholder="Username" autocomplete="username" autocapitalize="none">
      <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="authErr"></div>
      <button class="go" id="authGo">Log in</button>
      <div class="sw" id="authSw"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPA_URL = 'https://pktbulxtdobmylebxihw.supabase.co';
  var SUPA_KEY = 'sb_publishable_Osvp7GdHx-FWOy5vBEy5iA_k9n5M9pp';
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  var $ = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return [].slice.call(document.querySelectorAll(s)); };
  var me = null, myName = null, chatWith = null, view = 'chats';
  var auth = $('#auth'), err = $('#authErr'), mode = 'login';

  /* ---------- helpers ---------- */
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function initial(name){ return (name||'?').trim().charAt(0).toUpperCase() || '?'; }
  function fmtTime(iso){
    var d = new Date(iso);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    return d.toLocaleDateString([], {day:'numeric', month:'short'});
  }

  /* ---------- views ---------- */
  function show(v){
    view = v;
    $('#chatsView').style.display = v === 'chats' ? 'flex' : 'none';
    $('#searchView').style.display = v === 'search' ? 'flex' : 'none';
    $('#chatView').style.display = v === 'chat' ? 'flex' : 'none';
    $('#mainHead').style.display = v === 'chat' ? 'none' : 'flex';
    closeMenu();
    if (v === 'chats' && me) renderConvs();
    if (v === 'search') setTimeout(function(){ $('#searchInput').focus(); }, 60);
  }

  /* ---------- menu ---------- */
  var menu = $('#menu');
  function closeMenu(){ menu.classList.remove('open'); }
  $('#menuBtn').addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', closeMenu);
  $('#menuLogout').addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });

  /* ---------- auth ---------- */
  function setMode(m){
    mode = m;
    $('#authGo').textContent = m === 'login' ? 'Log in' : 'Create account';
    $('#authSub').textContent = m === 'login' ? 'Log in to chat with your friends!' : 'Pick a username and password. No email needed!';
    $('#authSw').innerHTML = m === 'login' ? 'New here? <button id="authToggle">Create an account</button>' : 'Have an account? <button id="authToggle">Log in</button>';
    $('#authToggle').addEventListener('click', function(){ setMode(mode === 'login' ? 'signup' : 'login'); });
  }
  setMode('login');

  async function doAuth(){
    var u = $('#authUser').value.trim().toLowerCase();
    var p = $('#authPass').value;
    err.textContent = '';
    if (!/^[a-z0-9_]{3,20}$/.test(u)) { err.textContent = 'Username: 3-20 small letters, numbers or _'; return; }
    if (p.length < 4) { err.textContent = 'Password needs 4+ characters'; return; }
    $('#authGo').disabled = true;
    try {
      var email = u + '@feather.chat';
      if (mode === 'signup'){
        var r = await sb.auth.signUp({ email: email, password: p, options: { data: { username: u } } });
        if (r.error) { err.textContent = /already|registered/i.test(r.error.message) ? 'That username is taken' : r.error.message; return; }
        me = r.data.user;
        if (!me) { err.textContent = 'Try logging in instead'; return; }
        var pr = await sb.from('profiles').insert({ id: me.id, username: u });
        if (pr.error && !/duplicate/.test(pr.error.message)) { err.textContent = pr.error.message; return; }
        await afterLogin();
      } else {
        var r2 = await sb.auth.signInWithPassword({ email: email, password: p });
        if (r2.error) { err.textContent = 'Wrong username or password'; return; }
        me = r2.data.user;
        await afterLogin();
      }
    } finally { $('#authGo').disabled = false; }
  }
  $('#authGo').addEventListener('click', doAuth);
  $('#authPass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doAuth(); });

  async function afterLogin(){
    var r = await sb.from('profiles').select('username').eq('id', me.id).maybeSingle();
    if (!r.data) {
      var un = (me.user_metadata && me.user_metadata.username) || ('user_' + me.id.slice(0,8));
      await sb.from('profiles').insert({ id: me.id, username: un });
      r = await sb.from('profiles').select('username').eq('id', me.id).maybeSingle();
    }
    myName = (r.data && r.data.username) || 'me';
    auth.hidden = true;
    $('#meLine').textContent = '@' + myName;
    subscribeRealtime();
    show('chats');
    toast('Hi ' + myName + '! 🪶');
  }

  /* ---------- realtime ---------- */
  function subscribeRealtime(){
    sb.channel('feather-msgs')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:'recipient=eq.'+me.id }, function(pl){ onIncoming(pl.new); })
      .subscribe();
  }
  function onIncoming(m){
    if (chatWith && m.sender === chatWith.id && view === 'chat') addBubble('in', m.body, m.created_at);
    else toast('💬 New message');
    if (view === 'chats') renderConvs();
  }

  /* ---------- chats list ---------- */
  async function renderConvs(){
    if (!me) return;
    var box = $('#convList');
    var r = await sb.from('messages').select('*').or('sender.eq.'+me.id+',recipient.eq.'+me.id).order('created_at', {ascending:false}).limit(300);
    var seen = {}, order = [];
    (r.data||[]).forEach(function(m){
      var other = m.sender === me.id ? m.recipient : m.sender;
      if (!seen[other]) { seen[other] = m; order.push(other); }
    });
    $('#noChats').hidden = order.length > 0;
    box.innerHTML = '';
    if (!order.length) return;
    var pr = await sb.from('profiles').select('id,username').in('id', order);
    var names = {}; (pr.data||[]).forEach(function(p){ names[p.id] = p.username; });
    order.forEach(function(id){
      var m = seen[id];
      var uname = names[id] || 'user';
      var b = document.createElement('button');
      b.className = 'crow';
      b.innerHTML = '<div class="avatar">' + esc(initial(uname)) + '</div>' +
        '<div class="mid"><div class="n">' + esc(uname) + '</div><div class="m"></div></div>' +
        '<div class="t">' + fmtTime(m.created_at) + '</div>';
      var body = m.body; if (body.length > 42) body = body.slice(0,42) + '…';
      b.querySelector('.m').textContent = (m.sender === me.id ? 'You: ' : '') + body;
      b.addEventListener('click', function(){ openChat({ id: id, username: uname }); });
      box.appendChild(b);
    });
  }

  /* ---------- search ---------- */
  $('#searchBtn').addEventListener('click', function(){ show(view === 'search' ? 'chats' : 'search'); });
  $('#searchInput').addEventListener('input', async function(){
    if (!me) return;
    var q = this.value.trim();
    var list = $('#searchList');
    list.innerHTML = '';
    $('#searchLabel').hidden = true;
    $('#searchEmpty').hidden = !!q;
    if (!q) return;
    var r = await sb.from('profiles').select('id,username').ilike('username', '%'+q.replace(/%/g,'')+'%').neq('id', me.id).limit(20);
    var data = r.data || [];
    if (!data.length){
      list.innerHTML = '<div class="empty" style="padding:30px 20px;">No one found with that name 🤔<br>Ask your friend to sign up first!</div>';
      return;
    }
    $('#searchLabel').hidden = false;
    data.forEach(function(u){
      var b = document.createElement('button');
      b.className = 'crow';
      b.innerHTML = '<div class="avatar">' + esc(initial(u.username)) + '</div>' +
        '<div class="mid"><div class="n">' + esc(u.username) + '</div><div class="m">Tap to chat 💬</div></div>';
      b.addEventListener('click', function(){ openChat(u); });
      list.appendChild(b);
    });
  });

  /* ---------- chat ---------- */
  $('#chatBack').addEventListener('click', function(){ chatWith = null; show('chats'); });
  function openChat(u){
    chatWith = u;
    $('#chatName').textContent = u.username;
    $('#chatAvatar').textContent = initial(u.username);
    $('#msgs').innerHTML = '<div class="day">Today</div>';
    show('chat');
    loadHistory();
  }
  async function loadHistory(){
    var a = me.id, b = chatWith.id;
    var r = await sb.from('messages').select('*')
      .or('and(sender.eq.'+a+',recipient.eq.'+b+'),and(sender.eq.'+b+',recipient.eq.'+a+')')
      .order('created_at', {ascending:true}).limit(200);
    $('#msgs').innerHTML = '<div class="day">Today</div>';
    (r.data||[]).forEach(function(m){ addBubble(m.sender === a ? 'out' : 'in', m.body, m.created_at); });
  }
  function addBubble(dir, text, ts){
    var d = document.createElement('div');
    d.className = 'bubble ' + dir;
    d.innerHTML = esc(text) + '<span class="tm">' + (ts ? fmtTime(ts) : '') + '</span>';
    $('#msgs').appendChild(d);
    d.scrollIntoView({block:'end'});
  }
  async function realSend(){
    var inp = $('#chatInput');
    var v = inp.value.trim();
    if (!v || !chatWith) return;
    inp.value = '';
    addBubble('out', v, new Date().toISOString());
    var r = await sb.from('messages').insert({ sender: me.id, recipient: chatWith.id, body: v });
    if (r.error) toast('Send failed - try again');
  }
  $('#chatSend').addEventListener('click', realSend);
  $('#chatInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') realSend(); });

  /* ---------- boot ---------- */
  (async function(){
    var r = await sb.auth.getSession();
    if (r.data.session) { me = r.data.session.user; afterLogin(); }
    else auth.hidden = false;
  })();
})();
</script>
</body>
</html>
